version: v2
managed:
  enabled: true

plugins:
  # OpenAPI spec generation
  - remote: buf.build/community/sudorandom-connect-openapi
    out: ../apps/default
    opt:
      - features=connectrpc;gnostic;protovalidate
      - content-types=json
      - allow-get

  # Dart protobuf generation. include_wkt re-emits google/protobuf/{any,duration,
  # field_mask,struct,timestamp}; delete those after generating (the SDK takes
  # WKTs from package:protobuf). descriptor.proto stays: buf/validate and
  # gnostic import it relatively.
  - remote: buf.build/protocolbuffers/dart:v25.1.0
    out: ../sdk/dart/notification/lib/src
    include_imports: true
    include_wkt: true

  # Dart ConnectRPC generation
  - remote: buf.build/connectrpc/dart:v2.0.0
    out: ../sdk/dart/notification/lib/src
    include_imports: true
    include_wkt: true
